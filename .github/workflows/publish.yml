name: Publish to Marketplace

on:
  push:
    branches: [main]
    tags:
      - v*-pre*

permissions:
  contents: write
  pull-requests: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        timeout-minutes: 2

      - run: npm run compile
        timeout-minutes: 2

      - run: npm test
        timeout-minutes: 2

      - name: Is pre-release
        id: type
        run: echo "pre=${{ github.ref_type == 'tag' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

      - name: Verify PAT
        timeout-minutes: 1
        run: npx @vscode/vsce verify-pat nabheet

      - name: Publish stable (with retry)
        if: steps.type.outputs.pre == 'false'
        timeout-minutes: 5
        run: |
          for i in $(seq 1 3); do
            if npx @vscode/vsce publish patch --no-git-tag-version; then
              echo "Published successfully"
              exit 0
            fi
            echo "Publish failed, retrying ($i/3)..."
            sleep 3
          done
          echo "Publish failed after 3 attempts" >&2
          exit 1

      - name: Publish pre-release
        if: steps.type.outputs.pre == 'true'
        timeout-minutes: 2
        run: npx @vscode/vsce publish patch --pre-release --no-git-tag-version

      - name: Get published version
        id: published
        run: echo "v=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create tag (stable only)
        if: steps.type.outputs.pre == 'false'
        run: |
          git tag v${{ steps.published.outputs.v }}
          git push origin v${{ steps.published.outputs.v }}

      - name: Create GitHub Release (stable only)
        if: steps.type.outputs.pre == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.published.outputs.v }}
          generate_release_notes: true
          files: "*.vsix"

      # Keep package.json version in sync with the marketplace. vsce bumps it
      # locally before publishing but never commits it, so without this the
      # repo copy goes stale and the NEXT release re-attempts the same version.
      # main is branch-protected (PRs only), so sync back via an auto-PR.
      # [skip ci] in the PR title makes the squash-merge commit skip CI/publish,
      # avoiding a re-trigger loop. CI still runs on the PR itself.
      - name: Sync version back via auto-PR (stable only)
        if: steps.type.outputs.pre == 'false'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/bump-v${{ steps.published.outputs.v }}"
          git add package.json
          git commit -m "chore: bump version to v${{ steps.published.outputs.v }}"
          git push origin "HEAD:$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to v${{ steps.published.outputs.v }} [skip ci]" \
            --body "Automated version sync after marketplace publish to v${{ steps.published.outputs.v }}.")"
          gh pr merge "$PR_URL" --squash --delete-branch
          # --wait is not supported by gh on the runner; poll instead.
          for i in $(seq 1 30); do
            if ! gh pr view "$PR_URL" --json state --jq .state >/dev/null 2>&1; then
              echo "PR merged and branch deleted"
              exit 0
            fi
            sleep 5
          done
          echo "PR merge did not complete in time" >&2
          exit 1
