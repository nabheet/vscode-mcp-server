name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --out vscode-ide-mcp-ci.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-ide-mcp-ci.vsix

  test-e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm test

      # Cache VS Code binary downloaded by @vscode/test-electron
      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: ~/.cache/vscode-test-electron
          key: ${{ runner.os }}-vscode-test-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-electron-

      # xvfb provides a virtual display for VS Code's GUI on headless CI runners
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Run E2E tests. The test auto-detects @vscode/test-electron for the VS Code
      # binary and wraps with xvfb-run on headless Linux.
      - name: Run E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
        timeout-minutes: 10

  # macOS e2e coverage: VS Code's darwin launch path is distinct (app binary
  # spawned directly, no CLI wrapper). Runners have a real windowserver
  # session, so no xvfb needed; the self-heal test freezes the leader's
  # process group with SIGSTOP exactly like local macOS runs.
  test-e2e-macos:
    runs-on: macos-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm test

      # Cache VS Code binary downloaded by @vscode/test-electron
      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: ~/.cache/vscode-test-electron
          key: ${{ runner.os }}-vscode-test-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-electron-

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

  # Per-PR pre-release: every PR push publishes a unique pre-release version
  # to the Marketplace pre-release channel. Marketplace only accepts plain
  # major.minor.patch (no semver pre-release tags), so PR builds use a
  # dedicated odd-minor line (0.9.<run_number>) that is always above the
  # stable 0.3.x line and never collides with it. Only same-repo, non-draft,
  # non-dependabot PRs. --skip-duplicate makes re-runs safe.
  publish-pre-release:
    runs-on: ubuntu-latest
    needs: [build, test-e2e, test-e2e-macos]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'ci/bump-v')
    permissions:
      contents: read
      pull-requests: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run compile

      - name: Compute pre-release version
        id: version
        run: |
          # Marketplace accepts ONLY major.minor.patch (no semver pre-release
          # tags) and requires pre-release versions to differ from stable.
          # Stable line is 0.3.x (patch bumps in the publish job), so PR builds
          # live on a dedicated odd-minor line 0.9.x — always above stable,
          # never colliding, and matching the odd/even recommendation.
          # run_number increases per workflow run, so every push gets a unique
          # version and the newest build always wins the pre-release channel.
          echo "version=0.9.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Verify PAT
        run: npx @vscode/vsce verify-pat nabheet

      - name: Publish pre-release
        run: >-
          npx @vscode/vsce publish "${{ steps.version.outputs.version }}"
          --pre-release --no-git-tag-version --no-update-package-json
          --skip-duplicate

      - name: Comment version on PR
        uses: actions/github-script@v9
        with:
          script: |
            const body = `Pre-release published: \`${{ steps.version.outputs.version }}\` — installable from the Marketplace pre-release channel.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const marker = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('Pre-release published:'));
            if (marker) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: marker.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # Stable publish to the Marketplace. Runs on push to main (post-merge
  # auto-publish) and manual dispatch. Uses a PAT (VSCE_PAT), not OIDC.
  #
  # RELEASE RULE (enforced by the "changes" step below): publish UNLESS every
  # path changed by this push is non-shipping.
  #   * NON-shipping (never cuts a release): package-lock.json, .github/**,
  #     and package.json when its only diffs are version and/or inert
  #     devDependencies (@types/*, vitest, biome, markdownlint, test-electron).
  #   * Everything else ships: src/** (compiled into out/extension.js),
  #     README.md and other VSIX files (README is bundled into the extension),
  #     and package.json when any shipping field changes — including a
  #     typescript or @vscode/vsce bump, which change the build/packaging.
  # This is what stops a dependabot devDependency merge (which only moves
  # package.json devDependencies + package-lock.json) from cutting a release.
  #
  # The `if:` below is kept as belt-and-braces: it still drops the version
  # sync-back squash merge (message "chore: bump version to vX.Y.Z (#N)") at the
  # job level, before a runner starts. workflow_dispatch always runs (head_commit
  # is null) and has no `before` commit, so the step below short-circuits it.
  publish:
    if: >-
      github.event_name != 'pull_request' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to v')
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The "changes" step below diffs github.event.before..github.sha.
          # actions/checkout is SHALLOW by default and omits the before commit,
          # so `git diff` would fail (or, worse, the guard would look correct and
          # never fire). Full history makes the diff always valid.
          fetch-depth: 0

      # Implements the RELEASE RULE documented on the job above. Lists the paths
      # this push changed and writes changed=true|false to $GITHUB_OUTPUT; every
      # later step is gated on that, so a non-shipping push produces no build,
      # no publish, no tag, no Release, and no version-sync PR.
      - name: Determine whether the push changed shipping files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() { # $1 = true|false (written to the step output), $2 = log line
            echo "changed=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }

          # Manual runs carry no `before`: a human explicitly asked to release.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit true "workflow_dispatch: publishing"
            exit 0
          fi

          # Empty or all-zero `before` (new branch): nothing to diff.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            emit true "no usable before commit: publishing"
            exit 0
          fi

          # Shallow-checkout trap. If the before commit is not present, fail
          # loudly instead of skipping (or falsely publishing) a release.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::error::before commit ${BEFORE} is not in this checkout; actions/checkout needs fetch-depth: 0"
            exit 1
          fi

          # Squash merges make before..sha exactly the merged PR's diff.
          changed_paths="$(git diff --name-only "$BEFORE" "$SHA")"
          echo "Paths changed by ${BEFORE}..${SHA}:"
          printf '%s\n' "$changed_paths"

          # package.json ships when any field other than version and inert
          # devDependencies differs. A typescript (compiler) or @vscode/vsce
          # (packager) bump is NOT inert — it can change the built extension —
          # so those two are kept in the comparison. Inert devDeps (@types/*,
          # vitest, biome, markdownlint, test-electron) are dropped. jq -S
          # normalises key order; on any error (e.g. file absent) treat it as
          # shipping.
          SHIPPING_DEVDEPS='["typescript","@vscode/vsce"]'
          pkg_shipping_changed() {
            local before after
            local normalise='del(.version)
              | if has("devDependencies")
                then .devDependencies |= with_entries(select(.key as $k | $devdeps | index($k)))
                else . end
              | if (.devDependencies // {}) == {} then del(.devDependencies) else . end'
            before="$(git show "${BEFORE}:package.json" 2>/dev/null | jq -S --argjson devdeps "$SHIPPING_DEVDEPS" "$normalise")" || return 0
            after="$(git show "${SHA}:package.json" 2>/dev/null | jq -S --argjson devdeps "$SHIPPING_DEVDEPS" "$normalise")" || return 0
            [ "$before" != "$after" ]
          }

          publish=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              package-lock.json|.github/*)
                echo "  skip:    $path (non-shipping)"
                ;;
              package.json)
                if pkg_shipping_changed; then
                  echo "  PUBLISH: $path (a shipping field changed)"
                  publish=true
                else
                  echo "  skip:    $path (only version/inert devDependencies changed)"
                fi
                ;;
              *)
                echo "  PUBLISH: $path"
                publish=true
                ;;
            esac
          done <<< "$changed_paths"

          emit "$publish" "RESULT: changed=$publish"

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2

      - run: npm run compile
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2

      - run: npm test
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2

      - name: Verify PAT
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 1
        run: npx @vscode/vsce verify-pat nabheet

      - name: Publish stable (with retry)
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 5
        run: |
          for i in $(seq 1 3); do
            if npx @vscode/vsce publish patch --no-git-tag-version; then
              echo "Published successfully"
              exit 0
            fi
            echo "Publish failed, retrying ($i/3)..."
            sleep 3
          done
          echo "Publish failed after 3 attempts" >&2
          exit 1

      - name: Get published version
        id: published
        if: steps.changes.outputs.changed == 'true'
        run: echo "v=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git tag v${{ steps.published.outputs.v }}
          git push origin v${{ steps.published.outputs.v }}

      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.published.outputs.v }}
          generate_release_notes: true
          files: "*.vsix"

      # Keep package.json version in sync with the marketplace. vsce bumps it
      # locally before publishing but never commits it, so without this the
      # repo copy goes stale and the NEXT release re-attempts the same version.
      # main is branch-protected (PRs only), so sync back via an auto-PR.
      # The PR title intentionally has NO [skip ci]: branch protection requires
      # CI on the PR, and [skip ci] skips it, making the PR unmergeable. Loop
      # prevention is handled by the job-level guard above, which matches the
      # squash-merge commit message "chore: bump version to vX.Y.Z (#N)".
      #
      # IMPORTANT: this step must push with a PERSONAL ACCESS TOKEN, not
      # GITHUB_TOKEN. Pushes made with GITHUB_TOKEN are attributed to
      # github-actions[bot], and GitHub holds CI runs on PRs whose head was
      # pushed by a bot for maintainer approval ("awaiting approval"). The
      # required checks then never run, branch protection blocks the merge,
      # and the sync PR hangs until a human approves the run. Pushing with a
      # PAT (owner: nabheet) attributes the run to a real user, so CI runs
      # immediately and the auto-merge queue completes on its own.
      - name: Sync version back via auto-PR
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/bump-v${{ steps.published.outputs.v }}"
          git add package.json
          git commit -m "chore: bump version to v${{ steps.published.outputs.v }}"
          git push origin "HEAD:$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to v${{ steps.published.outputs.v }}" \
           --body "Automated version sync after marketplace publish to v${{ steps.published.outputs.v }}.")"
           # --auto: merge once the required CI checks pass. Without it the
           # merge fails immediately because checks are still pending.
           gh pr merge "$PR_URL" --squash --delete-branch --auto
           # The required CI checks can take longer than this publish job's
           # timeout. Auto-merge is queued above; do not wait for the PR to
           # merge or mark a successful publish run as failed.
           echo "Version sync PR created and queued for auto-merge: $PR_URL"
