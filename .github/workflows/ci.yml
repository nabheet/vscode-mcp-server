name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs for the SAME PR only. Never cancel a push to main:
  # cancellation kills the whole run, including its `publish` job, and the
  # follow-up non-shipping push then skips — losing the release entirely.
  # github.head_ref is set only on pull_request events, so main pushes and
  # workflow_dispatch fall back to the unique run id and never cancel each
  # other. `publish` serialises itself via its own `group: publish`.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Default GITHUB_TOKEN scope for every job. Jobs that genuinely need more —
# publish-pre-release and publish — declare their own block, which replaces
# (does not merge with) this one. Read-only by default keeps a future job from
# silently inheriting write access, and satisfies CodeQL
# actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Keeps the release guard's "devDependency bumps are non-shipping"
      # classification honest: shipped source may not import a devDependency,
      # and tests must stay out of the compiled output.
      - run: npm run check:shipped-imports

      - run: npm test

      - run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --out vscode-ide-mcp-ci.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-ide-mcp-ci.vsix

  test-e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm test

      # Cache VS Code binary downloaded by @vscode/test-electron
      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: ~/.cache/vscode-test-electron
          key: ${{ runner.os }}-vscode-test-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-electron-

      # xvfb provides a virtual display for VS Code's GUI on headless CI runners
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Run E2E tests. The test auto-detects @vscode/test-electron for the VS Code
      # binary and wraps with xvfb-run on headless Linux.
      - name: Run E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
        timeout-minutes: 10

  # macOS e2e coverage: VS Code's darwin launch path is distinct (app binary
  # spawned directly, no CLI wrapper). Runners have a real windowserver
  # session, so no xvfb needed; the self-heal test freezes the leader's
  # process group with SIGSTOP exactly like local macOS runs.
  test-e2e-macos:
    runs-on: macos-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm test

      # Cache VS Code binary downloaded by @vscode/test-electron
      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: ~/.cache/vscode-test-electron
          key: ${{ runner.os }}-vscode-test-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-electron-

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

  test-e2e-windows:
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm test

      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 15

  # Per-PR pre-release: every PR push publishes a unique pre-release version
  # to the Marketplace pre-release channel. Marketplace only accepts plain
  # major.minor.patch (no semver pre-release tags), so PR builds use a
  # dedicated odd-minor line (0.9.<run_number>) that is always above the
  # stable 0.3.x line and never collides with it. Only same-repo, non-draft,
  # non-dependabot PRs. --skip-duplicate makes re-runs safe.
  publish-pre-release:
    runs-on: ubuntu-latest
    needs: [build, test-e2e, test-e2e-macos, test-e2e-windows]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'ci/bump-v')
    permissions:
      contents: read
      pull-requests: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run compile

      - name: Compute pre-release version
        id: version
        run: |
          # Marketplace accepts ONLY major.minor.patch (no semver pre-release
          # tags) and requires pre-release versions to differ from stable.
          # Stable line is 0.3.x (patch bumps in the publish job), so PR builds
          # live on a dedicated odd-minor line 0.9.x — always above stable,
          # never colliding, and matching the odd/even recommendation.
          # run_number increases per workflow run, so every push gets a unique
          # version and the newest build always wins the pre-release channel.
          echo "version=0.9.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Verify PAT
        run: npx @vscode/vsce verify-pat nabheet

      - name: Publish pre-release
        run: >-
          npx @vscode/vsce publish "${{ steps.version.outputs.version }}"
          --pre-release --no-git-tag-version --no-update-package-json
          --skip-duplicate

      - name: Comment version on PR
        uses: actions/github-script@v9
        with:
          script: |
            const body = `Pre-release published: \`${{ steps.version.outputs.version }}\` — installable from the Marketplace pre-release channel.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const marker = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('Pre-release published:'));
            if (marker) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: marker.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # Stable publish to the Marketplace. Runs on push to main (post-merge
  # auto-publish) and manual dispatch. Uses a PAT (VSCE_PAT), not OIDC.
  #
  # RELEASE RULE (enforced by the "changes" step below): publish UNLESS every
  # path changed since the last release (newest v* tag) is non-shipping.
  #   * NON-shipping (never cuts a release): package-lock.json, .github/**,
  #     and package.json when its only diffs are version and/or the INERT
  #     devDependencies (the allowlist in the step below: @types/*, vitest,
  #     biome, markdownlint, test-electron).
  #   * Everything else ships: src/** (compiled into out/extension.js),
  #     README.md and other VSIX files (README is bundled into the extension),
  #     and package.json when any shipping field changes. A devDependency bump
  #     ships UNLESS the dep is on the inert list — so typescript, @vscode/vsce,
  #     or any future bundler/compiler plugin still cuts a release.
  # This is what stops a dependabot devDependency merge (which only moves
  # package.json devDependencies + package-lock.json) from cutting a release.
  #
  # Because the baseline is the last release, a shipping change whose publish
  # failed stays "unreleased" and is retried by the next run, including on a
  # later non-shipping push. The tag also survives force-pushes, where
  # `github.event.before` can be unreachable.
  #
  # The `if:` below is kept as belt-and-braces: it still drops the version
  # sync-back squash merge (message "chore: bump version to vX.Y.Z (#N)") at the
  # job level, before a runner starts. workflow_dispatch always runs (head_commit
  # is null) and short-circuits the step below.
  publish:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to v')
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The "changes" step below diffs the last release tag (or, with no
          # tag yet, github.event.before) against github.sha. actions/checkout
          # is SHALLOW by default and omits those commits, so `git diff` would
          # fail (or, worse, the guard would look correct and never fire).
          # Tags matter too: `git describe` needs them and shallow clones drop
          # them. Full history makes the diff always valid.
          fetch-depth: 0

      # Implements the RELEASE RULE documented on the job above. Writes
      # changed=true|false to $GITHUB_OUTPUT; every later step is gated on it,
      # so a non-shipping push produces no build, no publish, no tag, no
      # Release, and no version-sync PR.
      #
      # The baseline is the last RELEASE (newest v* tag), not this push's
      # `before`. A per-push baseline loses a release when a shipping push's
      # publish fails: the next non-shipping push diffs only itself and skips,
      # and the unshipped change waits for the next shipping push. Diffing
      # from the last released commit means any unreleased shipping change is
      # re-detected on every later run, so the publish retries.
      - name: Determine whether there are unreleased shipping changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() { # $1 = true|false (written to the step output), $2 = log line
            echo "changed=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
          }

          # Manual runs: a human explicitly asked to release.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit true "workflow_dispatch: publishing"
            exit 0
          fi

          # Newest release tag marks the last commit that shipped. It also
          # survives force-pushes and rewrite of `before`.
          BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$BASE" ]; then
            echo "Baseline: last release tag ${BASE}"
          else
            # No release tag yet (first release): fall back to this push.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              emit true "no release tag and no usable before commit: publishing"
              exit 0
            fi
            BASE="$BEFORE"
            echo "Baseline: no release tag yet, using before commit ${BASE}"
          fi

          # Shallow-checkout trap. If the baseline commit is not present, fail
          # loudly instead of skipping (or falsely publishing) a release.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::baseline commit ${BASE} is not in this checkout; actions/checkout needs fetch-depth: 0 with tags"
            exit 1
          fi

          # Squash merges make tag..sha exactly the unreleased diff.
          # --no-renames: with rename detection on, `--name-only` reports only
          # the NEW path of a rename, so a rename INTO a non-shipping path would
          # hide the shipping source (e.g. `git mv src/a.ts .github/a.ts`).
          changed_paths="$(git diff --no-renames --name-only "$BASE" "$SHA")"
          echo "Paths changed by ${BASE}..${SHA}:"
          printf '%s\n' "$changed_paths"

          # package.json ships when any field other than version and an INERT
          # devDependency differs. INERT is the explicit list below (build/test/
          # lint only, never in the VSIX); EVERYTHING ELSE defaults to shipping,
          # so an unknown or future devDep — a bundler, a compiler plugin —
          # still cuts a release when bumped. jq -S normalises key order; on any
          # error (e.g. file absent) treat it as shipping.
          INERT_DEVDEPS='["@types/node","@types/vscode","vitest","@biomejs/biome","markdownlint-cli2","@vscode/test-electron"]'

          # The literal above is the list this commit publishes under. The guard
          # compares against the copy on the base revision instead, so a PR that
          # adds a dependency to the list cannot skip that dependency's own
          # release — the entry has to land through review first. No literal on
          # the base (guard newly added) means everything ships, the
          # fail-closed direction.
          INERT_DEVDEPS="$(git show "${BEFORE}:.github/workflows/ci.yml" 2>/dev/null \
            | sed -n "s/^[[:space:]]*INERT_DEVDEPS='\(.*\)'[[:space:]]*$/\1/p" \
            | head -n1 || true)"
          [ -n "$INERT_DEVDEPS" ] || INERT_DEVDEPS='[]'

          pkg_shipping_changed() {
            local before after
            local normalise='del(.version)
              | if has("devDependencies")
                then .devDependencies |= with_entries(select(.key as $k | ($inert | index($k)) | not))
                else . end
              | if (.devDependencies // {}) == {} then del(.devDependencies) else . end'
            before="$(git show "${BEFORE}:package.json" 2>/dev/null | jq -S --argjson inert "$INERT_DEVDEPS" "$normalise")" || return 0
            after="$(git show "${SHA}:package.json" 2>/dev/null | jq -S --argjson inert "$INERT_DEVDEPS" "$normalise")" || return 0
            [ "$before" != "$after" ]
          }

          publish=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              package-lock.json|.github/*)
                echo "  skip:    $path (non-shipping)"
                ;;
              package.json)
                if pkg_shipping_changed; then
                  echo "  PUBLISH: $path (a shipping field changed)"
                  publish=true
                else
                  echo "  skip:    $path (only version/inert devDependencies changed)"
                fi
                ;;
              *)
                echo "  PUBLISH: $path"
                publish=true
                ;;
            esac
          done <<< "$changed_paths"

          emit "$publish" "RESULT: changed=$publish"

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2

      - run: npm run compile
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2

      - run: npm test
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2

      - name: Verify PAT
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 1
        run: npx @vscode/vsce verify-pat nabheet

      - name: Resolve the version to publish
        id: target
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 2
        run: |
          # package.json can lag the marketplace while the version-sync PR is
          # still open. `vsce publish patch` bumps from package.json, so a
          # publish that lands first re-attempts a version that already exists
          # and fails. Publish one patch above whichever side is higher,
          # comparing only the local major.minor line so the 0.9.x pre-release
          # builds never drag the stable line upwards.
          local="$(jq -r .version package.json)"
          # Extension id from package.json, so the workflow does not repeat the
          # publisher name.
          extension="$(jq -r '.publisher + "." + .name' package.json)"
          show_json="$(mktemp)"
          show_err="$(mktemp)"
          trap 'rm -f "$show_json" "$show_err"' EXIT
          if ! npx --yes @vscode/vsce show "$extension" --json \
            >"$show_json" 2>"$show_err"; then
            if grep -qiE "not found|404" "$show_err"; then
              echo "::notice::no published versions for ${extension} yet"
              echo '{"versions":[]}' >"$show_json"
            else
              # Guessing here would re-create the stale-version failure this
              # step exists to prevent, so stop and say why.
              echo "::error::could not read published versions for ${extension}"
              cat "$show_err"
              exit 1
            fi
          elif [ "$(tr -d '[:space:]' <"$show_json")" != "undefined" ] \
            && ! jq -e 'has("versions")' "$show_json" >/dev/null 2>&1; then
            echo "::error::unexpected output from vsce show for ${extension}:"
            cat "$show_json"
            exit 1
          elif ! jq -e 'has("versions")' "$show_json" >/dev/null 2>&1; then
            # An id that was never published exits 0 and prints `undefined`
            # rather than JSON, so this, not the exit code, is the real test.
            echo "::notice::no published versions for ${extension} yet"
            echo '{"versions":[]}' >"$show_json"
          fi
          remote="$(jq -r --arg line "${local%.*}" '[.versions[].version]
              | map(select((contains("-") | not) and (startswith($line + "."))))
              | sort_by(split(".") | map(tonumber))
              | last // empty' "$show_json")"
          target="$(jq -rn --arg l "$local" --arg r "${remote:-$local}" '
            def v: split(".") | map(tonumber);
            ($l | v) as $L | ($r | v) as $R
            | (if $L >= $R then $L else $R end) as $hi
            | ($hi[0:2] + [$hi[2] + 1]) | join(".")')"
          echo "package.json=${local} marketplace=${remote:-unknown} target=${target}"
          jq --arg v "$target" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "version=${target}" >> "$GITHUB_OUTPUT"

      - name: Publish stable (with retry)
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          EXTENSION="$(jq -r '.publisher + "." + .name' package.json)"
          # A failed client call does not prove the marketplace rejected the
          # upload, so after a failure check whether this exact version is
          # there; that is a success, not something to retry.
          for i in $(seq 1 3); do
            if npx @vscode/vsce publish "$VERSION" \
              --no-git-tag-version --no-update-package-json; then
              echo "Published $VERSION"
              exit 0
            fi
            if timeout 90 npx --yes @vscode/vsce show "$EXTENSION" --json 2>/dev/null \
              | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' \
                >/dev/null; then
              echo "Published $VERSION (marketplace already lists it)"
              exit 0
            fi
            echo "Publish failed, retrying ($i/3)..."
            sleep 3
          done
          echo "Publish failed after 3 attempts" >&2
          exit 1

      - name: Get published version
        id: published
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: echo "v=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git tag v${{ steps.published.outputs.v }}
          git push origin v${{ steps.published.outputs.v }}

      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.published.outputs.v }}
          generate_release_notes: true
          files: "*.vsix"

      # Keep package.json version in sync with the marketplace. vsce bumps it
      # locally before publishing but never commits it, so without this the
      # repo copy goes stale and the NEXT release re-attempts the same version.
      # main is branch-protected (PRs only), so sync back via an auto-PR.
      # The PR title intentionally has NO [skip ci]: branch protection requires
      # CI on the PR, and [skip ci] skips it, making the PR unmergeable. Loop
      # prevention is handled by the job-level guard above, which matches the
      # squash-merge commit message "chore: bump version to vX.Y.Z (#N)".
      #
      # IMPORTANT: this step must push with a PERSONAL ACCESS TOKEN, not
      # GITHUB_TOKEN. Pushes made with GITHUB_TOKEN are attributed to
      # github-actions[bot], and GitHub holds CI runs on PRs whose head was
      # pushed by a bot for maintainer approval ("awaiting approval"). The
      # required checks then never run, branch protection blocks the merge,
      # and the sync PR hangs until a human approves the run. Pushing with a
      # PAT (owner: nabheet) attributes the run to a real user, so CI runs
      # immediately and the auto-merge queue completes on its own.
      - name: Sync version back via auto-PR
        if: steps.changes.outputs.changed == 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_PAT }}
          GH_SYNC_PAT: ${{ secrets.GH_SYNC_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/bump-v${{ steps.published.outputs.v }}"

          # An older sync PR cannot merge while main has moved on: branch
          # protection wants an up-to-date branch, and the queued squash merge
          # does not update it. Close them so only the current version is
          # proposed.
          for n in $(gh pr list --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ci/bump-v")) | .number'); do
            gh pr close "$n" --delete-branch \
              --comment "Superseded by v${{ steps.published.outputs.v }}."
          done

          git add package.json
          git commit -m "chore: bump version to v${{ steps.published.outputs.v }}"
          # Authenticate the push with the PAT, not the GITHUB_TOKEN that
          # checkout persisted: a bot-authored push leaves the sync PR's CI run
          # waiting for maintainer approval, so auto-merge never fires. The
          # persisted credential is a URL-scoped header, which git prefers over
          # `-c`, so drop it first. The token goes in a header, not the URL.
          git config --unset-all "http.https://github.com/.extraheader" || true
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_SYNC_PAT" | base64 | tr -d '\n')" \
            push origin "HEAD:$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to v${{ steps.published.outputs.v }}" \
           --body "Automated version sync after marketplace publish to v${{ steps.published.outputs.v }}.")"
           # --auto: merge once the required CI checks pass. Without it the
           # merge fails immediately because checks are still pending.
           gh pr merge "$PR_URL" --squash --delete-branch --auto
           # The required CI checks can take longer than this publish job's
           # timeout. Auto-merge is queued above; do not wait for the PR to
           # merge or mark a successful publish run as failed.
           echo "Version sync PR created and queued for auto-merge: $PR_URL"
